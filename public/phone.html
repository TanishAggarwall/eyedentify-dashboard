<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0c11">
  <title>Phone camera · EYEDENTIFY ONE</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0c11; --surface: #16151c; --surface-2: #1d1c25; --line: #2a2833; --text: #eeedf3; --muted: #9b98a8;
      --purple: #8b55f7; --purple-hover: #9d6dff; --green: #4ade80; --amber: #fbbf24; --red: #f87171;
      --head: 'Manrope', 'Segoe UI', Arial, sans-serif; --body: 'DM Sans', 'Segoe UI', Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100%; }
    body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 8px; font-family: var(--head); font-weight: 800; letter-spacing: -.02em; font-size: 1.1rem; }
    .brand img { width: 28px; height: 28px; }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
    .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .pill.ok { color: var(--text); } .pill.ok i { background: var(--green); box-shadow: 0 0 0 4px #4ade8026; }
    .pill.warn i { background: var(--amber); } .pill.bad i { background: var(--red); }
    main { display: grid; gap: 14px; align-content: start; }
    .viewfinder { position: relative; border-radius: 18px; overflow: hidden; background: #000; border: 1px solid var(--line); aspect-ratio: 3 / 4; max-height: 62dvh; width: 100%; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; font-size: .95rem; }
    h1 { font-family: var(--head); font-size: 1.35rem; letter-spacing: -.03em; }
    p { color: var(--muted); line-height: 1.5; font-size: .95rem; }
    .status { min-height: 1.5em; color: var(--text); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button, input { font: inherit; }
    .button { flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-weight: 700; font-size: 1rem; cursor: pointer; padding: 0 18px; }
    .button.primary { background: var(--purple); border-color: var(--purple); color: #fff; }
    .button.primary:hover { background: var(--purple-hover); }
    .button:focus-visible, input:focus-visible { outline: 3px solid #c3a6ff; outline-offset: 2px; }
    form { display: grid; gap: 10px; }
    input { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0 16px; font-size: 1.3rem; letter-spacing: .3em; text-transform: uppercase; text-align: center; }
    .stats { font-size: .82rem; color: var(--muted); text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="icon.svg" alt="">EYEDENTIFY</div>
    <span class="pill" id="pill" role="status"><i></i><span id="pill-text">Not connected</span></span>
  </header>

  <main>
    <form id="code-form" hidden>
      <h1>Use this phone as the camera</h1>
      <p>Enter the 6-letter code shown on the laptop dashboard.</p>
      <label class="sr" for="code-input" hidden>Pairing code</label>
      <input id="code-input" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" aria-label="Pairing code" required>
      <button class="button primary" type="submit">Continue</button>
    </form>

    <section id="cam-section" hidden>
      <div class="viewfinder">
        <video id="preview" playsinline muted autoplay aria-label="Camera preview"></video>
        <div class="empty" id="empty">Tap <strong>&nbsp;Start streaming&nbsp;</strong> and allow camera access.</div>
      </div>
    </section>

    <div>
      <h1 id="title" hidden>Streaming to the laptop</h1>
      <p class="status" id="status" aria-live="polite"></p>
    </div>

    <div class="row" id="controls" hidden>
      <button class="button primary" id="start-btn">Start streaming</button>
      <button class="button" id="flip-btn" hidden>Flip camera</button>
      <button class="button" id="stop-btn" hidden>Stop</button>
    </div>
  </main>

  <footer class="stats" id="stats">Point the back camera where the glasses would look. Keep this screen open.</footer>

  <script type="module" src="js/phone.js"></script>
</body>
</html>
